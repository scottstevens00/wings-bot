name: Wings elimination bot

on:
  schedule:
    - cron: "15 12,13,14,15 * * *"   # mornings ET (covers EDT/EST + GitHub delays); sends once per day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the tweet instead of sending it"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "wings-bot"
          git config user.email "wings-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state" && git push
